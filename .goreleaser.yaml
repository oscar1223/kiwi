version: 2

project_name: kiwi

before:
  hooks:
    - go mod download

builds:
  - id: kiwi
    main: ./cmd/kiwi
    binary: kiwi
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      # -s -w strips symbols and DWARF: the unstripped binary is ~76 MB.
      # -X injects the version into cmd/kiwi/root.go:13 (var version = "dev").
      - -s -w -X main.version={{ .Version }}

archives:
  - id: kiwi
    # Stable, versionless name: install.sh builds this URL by hand.
    name_template: "kiwi_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

# Homebrew: our own tap, without going through homebrew-core.
homebrew_casks:
  - name: kiwi
    binaries: [kiwi]
    repository:
      owner: oscar1223
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/oscar1223/kiwi"
    description: "Local-first coding agent for the terminal"
    # The binary is not signed by Apple: drop the quarantine macOS puts on
    # everything downloaded, or Gatekeeper blocks it. Homebrew 7 deprecates
    # Ruby `postflight` blocks in favor of `postflight_steps`, which
    # GoReleaser does not generate yet: it goes in as a literal block.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/kiwi"], must_succeed: false
        end
      end

scoops:
  - name: kiwi
    repository:
      owner: oscar1223
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/oscar1223/kiwi"
    description: "Local-first coding agent for the terminal"
    license: MIT
