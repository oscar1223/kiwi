# Temporal: comprueba que el TAP_GITHUB_TOKEN almacenado funciona desde
# Actions. Se borra en cuanto dé verde.
name: Check tap token

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: ¿Puede escribir el token en el tap y el bucket?
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          for r in homebrew-tap scoop-bucket; do
            printf '%s -> push: ' "$r"
            gh api "repos/oscar1223/$r" --jq '.permissions.push'
          done
