name: Bug
description: Something in Kiwi does not work as it should. Lands on the board, in Backlog.
labels: [bug]
projects: ["oscar1223/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What happens, including the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kiwi --version` (or `kiwi-dev --version`).
      placeholder: kiwi version 0.1.0
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Installation
      options:
        - kiwi (Homebrew)
        - kiwi (install.sh / install.ps1 / Scoop)
        - kiwi-dev (make dev)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Optional. Formatted as a code block.
      render: shell
