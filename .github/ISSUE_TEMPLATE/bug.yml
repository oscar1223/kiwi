name: Bug
description: Algo de Kiwi no funciona como debería. Entra en el tablero, en Backlog.
labels: [bug]
projects: ["oscar1223/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Lo que ocurre, incluido el mensaje de error si lo hay.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `kiwi --version` (o `kiwi-dev --version`).
      placeholder: kiwi version 0.1.0
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Instalación
      options:
        - kiwi (Homebrew)
        - kiwi (install.sh / install.ps1 / Scoop)
        - kiwi-dev (make dev)
        - Compilado desde fuentes
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o salida
      description: Opcional. Se formatea como bloque de código.
      render: shell
