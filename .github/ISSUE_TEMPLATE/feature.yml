name: New feature
description: An idea or improvement for Kiwi. Lands on the board, in Backlog.
labels: [enhancement]
projects: ["oscar1223/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What Kiwi should be able to do that it cannot today.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or the use case.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to check that it is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Relevant packages, files or decisions (optional).
